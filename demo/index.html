<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b0b0c">
<title>Yardbell Tab – Demo</title>
<style>
/* required styles */

.leaflet-pane,
.leaflet-tile,
.leaflet-marker-icon,
.leaflet-marker-shadow,
.leaflet-tile-container,
.leaflet-pane > svg,
.leaflet-pane > canvas,
.leaflet-zoom-box,
.leaflet-image-layer,
.leaflet-layer {
	position: absolute;
	left: 0;
	top: 0;
	}
.leaflet-container {
	overflow: hidden;
	}
.leaflet-tile,
.leaflet-marker-icon,
.leaflet-marker-shadow {
	-webkit-user-select: none;
	   -moz-user-select: none;
	        user-select: none;
	  -webkit-user-drag: none;
	}
/* Prevents IE11 from highlighting tiles in blue */
.leaflet-tile::selection {
	background: transparent;
}
/* Safari renders non-retina tile on retina better with this, but Chrome is worse */
.leaflet-safari .leaflet-tile {
	image-rendering: -webkit-optimize-contrast;
	}
/* hack that prevents hw layers "stretching" when loading new tiles */
.leaflet-safari .leaflet-tile-container {
	width: 1600px;
	height: 1600px;
	-webkit-transform-origin: 0 0;
	}
.leaflet-marker-icon,
.leaflet-marker-shadow {
	display: block;
	}
/* .leaflet-container svg: reset svg max-width decleration shipped in Joomla! (joomla.org) 3.x */
/* .leaflet-container img: map is broken in FF if you have max-width: 100% on tiles */
.leaflet-container .leaflet-overlay-pane svg {
	max-width: none !important;
	max-height: none !important;
	}
.leaflet-container .leaflet-marker-pane img,
.leaflet-container .leaflet-shadow-pane img,
.leaflet-container .leaflet-tile-pane img,
.leaflet-container img.leaflet-image-layer,
.leaflet-container .leaflet-tile {
	max-width: none !important;
	max-height: none !important;
	width: auto;
	padding: 0;
	}

.leaflet-container img.leaflet-tile {
	/* See: https://bugs.chromium.org/p/chromium/issues/detail?id=600120 */
	mix-blend-mode: plus-lighter;
}

.leaflet-container.leaflet-touch-zoom {
	-ms-touch-action: pan-x pan-y;
	touch-action: pan-x pan-y;
	}
.leaflet-container.leaflet-touch-drag {
	-ms-touch-action: pinch-zoom;
	/* Fallback for FF which doesn't support pinch-zoom */
	touch-action: none;
	touch-action: pinch-zoom;
}
.leaflet-container.leaflet-touch-drag.leaflet-touch-zoom {
	-ms-touch-action: none;
	touch-action: none;
}
.leaflet-container {
	-webkit-tap-highlight-color: transparent;
}
.leaflet-container a {
	-webkit-tap-highlight-color: rgba(51, 181, 229, 0.4);
}
.leaflet-tile {
	filter: inherit;
	visibility: hidden;
	}
.leaflet-tile-loaded {
	visibility: inherit;
	}
.leaflet-zoom-box {
	width: 0;
	height: 0;
	-moz-box-sizing: border-box;
	     box-sizing: border-box;
	z-index: 800;
	}
/* workaround for https://bugzilla.mozilla.org/show_bug.cgi?id=888319 */
.leaflet-overlay-pane svg {
	-moz-user-select: none;
	}

.leaflet-pane         { z-index: 400; }

.leaflet-tile-pane    { z-index: 200; }
.leaflet-overlay-pane { z-index: 400; }
.leaflet-shadow-pane  { z-index: 500; }
.leaflet-marker-pane  { z-index: 600; }
.leaflet-tooltip-pane   { z-index: 650; }
.leaflet-popup-pane   { z-index: 700; }

.leaflet-map-pane canvas { z-index: 100; }
.leaflet-map-pane svg    { z-index: 200; }

.leaflet-vml-shape {
	width: 1px;
	height: 1px;
	}
.lvml {
	behavior: url(#default#VML);
	display: inline-block;
	position: absolute;
	}


/* control positioning */

.leaflet-control {
	position: relative;
	z-index: 800;
	pointer-events: visiblePainted; /* IE 9-10 doesn't have auto */
	pointer-events: auto;
	}
.leaflet-top,
.leaflet-bottom {
	position: absolute;
	z-index: 1000;
	pointer-events: none;
	}
.leaflet-top {
	top: 0;
	}
.leaflet-right {
	right: 0;
	}
.leaflet-bottom {
	bottom: 0;
	}
.leaflet-left {
	left: 0;
	}
.leaflet-control {
	float: left;
	clear: both;
	}
.leaflet-right .leaflet-control {
	float: right;
	}
.leaflet-top .leaflet-control {
	margin-top: 10px;
	}
.leaflet-bottom .leaflet-control {
	margin-bottom: 10px;
	}
.leaflet-left .leaflet-control {
	margin-left: 10px;
	}
.leaflet-right .leaflet-control {
	margin-right: 10px;
	}


/* zoom and fade animations */

.leaflet-fade-anim .leaflet-popup {
	opacity: 0;
	-webkit-transition: opacity 0.2s linear;
	   -moz-transition: opacity 0.2s linear;
	        transition: opacity 0.2s linear;
	}
.leaflet-fade-anim .leaflet-map-pane .leaflet-popup {
	opacity: 1;
	}
.leaflet-zoom-animated {
	-webkit-transform-origin: 0 0;
	    -ms-transform-origin: 0 0;
	        transform-origin: 0 0;
	}
svg.leaflet-zoom-animated {
	will-change: transform;
}

.leaflet-zoom-anim .leaflet-zoom-animated {
	-webkit-transition: -webkit-transform 0.25s cubic-bezier(0,0,0.25,1);
	   -moz-transition:    -moz-transform 0.25s cubic-bezier(0,0,0.25,1);
	        transition:         transform 0.25s cubic-bezier(0,0,0.25,1);
	}
.leaflet-zoom-anim .leaflet-tile,
.leaflet-pan-anim .leaflet-tile {
	-webkit-transition: none;
	   -moz-transition: none;
	        transition: none;
	}

.leaflet-zoom-anim .leaflet-zoom-hide {
	visibility: hidden;
	}


/* cursors */

.leaflet-interactive {
	cursor: pointer;
	}
.leaflet-grab {
	cursor: -webkit-grab;
	cursor:    -moz-grab;
	cursor:         grab;
	}
.leaflet-crosshair,
.leaflet-crosshair .leaflet-interactive {
	cursor: crosshair;
	}
.leaflet-popup-pane,
.leaflet-control {
	cursor: auto;
	}
.leaflet-dragging .leaflet-grab,
.leaflet-dragging .leaflet-grab .leaflet-interactive,
.leaflet-dragging .leaflet-marker-draggable {
	cursor: move;
	cursor: -webkit-grabbing;
	cursor:    -moz-grabbing;
	cursor:         grabbing;
	}

/* marker & overlays interactivity */
.leaflet-marker-icon,
.leaflet-marker-shadow,
.leaflet-image-layer,
.leaflet-pane > svg path,
.leaflet-tile-container {
	pointer-events: none;
	}

.leaflet-marker-icon.leaflet-interactive,
.leaflet-image-layer.leaflet-interactive,
.leaflet-pane > svg path.leaflet-interactive,
svg.leaflet-image-layer.leaflet-interactive path {
	pointer-events: visiblePainted; /* IE 9-10 doesn't have auto */
	pointer-events: auto;
	}

/* visual tweaks */

.leaflet-container {
	background: #ddd;
	outline-offset: 1px;
	}
.leaflet-container a {
	color: #0078A8;
	}
.leaflet-zoom-box {
	border: 2px dotted #38f;
	background: rgba(255,255,255,0.5);
	}


/* general typography */
.leaflet-container {
	font-family: "Helvetica Neue", Arial, Helvetica, sans-serif;
	font-size: 12px;
	font-size: 0.75rem;
	line-height: 1.5;
	}


/* general toolbar styles */

.leaflet-bar {
	box-shadow: 0 1px 5px rgba(0,0,0,0.65);
	border-radius: 4px;
	}
.leaflet-bar a {
	background-color: #fff;
	border-bottom: 1px solid #ccc;
	width: 26px;
	height: 26px;
	line-height: 26px;
	display: block;
	text-align: center;
	text-decoration: none;
	color: black;
	}
.leaflet-bar a,
.leaflet-control-layers-toggle {
	background-position: 50% 50%;
	background-repeat: no-repeat;
	display: block;
	}
.leaflet-bar a:hover,
.leaflet-bar a:focus {
	background-color: #f4f4f4;
	}
.leaflet-bar a:first-child {
	border-top-left-radius: 4px;
	border-top-right-radius: 4px;
	}
.leaflet-bar a:last-child {
	border-bottom-left-radius: 4px;
	border-bottom-right-radius: 4px;
	border-bottom: none;
	}
.leaflet-bar a.leaflet-disabled {
	cursor: default;
	background-color: #f4f4f4;
	color: #bbb;
	}

.leaflet-touch .leaflet-bar a {
	width: 30px;
	height: 30px;
	line-height: 30px;
	}
.leaflet-touch .leaflet-bar a:first-child {
	border-top-left-radius: 2px;
	border-top-right-radius: 2px;
	}
.leaflet-touch .leaflet-bar a:last-child {
	border-bottom-left-radius: 2px;
	border-bottom-right-radius: 2px;
	}

/* zoom control */

.leaflet-control-zoom-in,
.leaflet-control-zoom-out {
	font: bold 18px 'Lucida Console', Monaco, monospace;
	text-indent: 1px;
	}

.leaflet-touch .leaflet-control-zoom-in, .leaflet-touch .leaflet-control-zoom-out  {
	font-size: 22px;
	}

/* attribution and scale controls */

.leaflet-container .leaflet-control-attribution {
	background: #fff;
	background: rgba(255, 255, 255, 0.8);
	margin: 0;
	}
.leaflet-control-attribution,
.leaflet-control-scale-line {
	padding: 0 5px;
	color: #333;
	line-height: 1.4;
	}
.leaflet-control-attribution a {
	text-decoration: none;
	}
.leaflet-control-attribution a:hover,
.leaflet-control-attribution a:focus {
	text-decoration: underline;
	}
.leaflet-attribution-flag {
	display: inline !important;
	vertical-align: baseline !important;
	width: 1em;
	height: 0.6669em;
	}
.leaflet-left .leaflet-control-scale {
	margin-left: 5px;
	}
.leaflet-bottom .leaflet-control-scale {
	margin-bottom: 5px;
	}
.leaflet-control-scale-line {
	border: 2px solid #777;
	border-top: none;
	line-height: 1.1;
	padding: 2px 5px 1px;
	white-space: nowrap;
	-moz-box-sizing: border-box;
	     box-sizing: border-box;
	background: rgba(255, 255, 255, 0.8);
	text-shadow: 1px 1px #fff;
	}
.leaflet-control-scale-line:not(:first-child) {
	border-top: 2px solid #777;
	border-bottom: none;
	margin-top: -2px;
	}
.leaflet-control-scale-line:not(:first-child):not(:last-child) {
	border-bottom: 2px solid #777;
	}

.leaflet-touch .leaflet-control-attribution,
.leaflet-touch .leaflet-control-layers,
.leaflet-touch .leaflet-bar {
	box-shadow: none;
	}
.leaflet-touch .leaflet-control-layers,
.leaflet-touch .leaflet-bar {
	border: 2px solid rgba(0,0,0,0.2);
	background-clip: padding-box;
	}


/* popup */

.leaflet-popup {
	position: absolute;
	text-align: center;
	margin-bottom: 20px;
	}
.leaflet-popup-content-wrapper {
	padding: 1px;
	text-align: left;
	border-radius: 12px;
	}
.leaflet-popup-content {
	margin: 13px 24px 13px 20px;
	line-height: 1.3;
	font-size: 13px;
	font-size: 1.08333em;
	min-height: 1px;
	}

.kbar{height:6px;border-radius:9px;background:rgba(255,255,255,.25);margin-top:10px}.kbar i{display:block;height:100%;border-radius:9px;background:#fff}

.chart .zr{fill:rgba(140,184,232,.12)}.chart .cl{fill:none;stroke:var(--or);stroke-width:2.6;stroke-linejoin:round}.chart .cd{fill:#07090c;stroke:var(--or);stroke-width:2}

.ring .rb{font:700 22px system-ui;fill:#f4f4f5}.ring .rs{font:600 10px system-ui;fill:var(--mut)}
.mini2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.mini2 div{background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:14px;padding:8px 10px}.mini2 small{display:block;font-size:11px;color:var(--mut)}.mini2 b{font-size:16px}

/* ===== Tablet-Bedienung: Menü als Schublade, Tab-Leiste unten, große Felder ===== */

#main{width:100%}
#top{gap:12px;padding:6px 6px 12px}

/* Inhalte breiter und größer */
.split{grid-template-columns:1fr;gap:12px}

.blk{margin-bottom:16px}
.bt{font-size:19px}

  .g4{grid-template-columns:1fr 1fr}.g3{grid-template-columns:1fr}.g2{grid-template-columns:1fr}
  .row2,.row3{grid-template-columns:1fr}.acts{grid-template-columns:1fr 1fr}

/* Ebenen: Menü über allem, Karte darunter */
#bgx{z-index:-1}
#shell{z-index:auto}
#map,.minimap,.trkbox,#hMini,#lkMap{position:relative;z-index:0;isolation:isolate}

/* Felder antippen, Auswahlfenster, Zeile fertig */

.sheet{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;padding:12px}

/* ===== v1.5 · Heft als Kachel-Dashboard, ganzer Bildschirm, Animationen ===== */
:root{--ease:cubic-bezier(.2,.9,.2,1);--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);--sal:env(safe-area-inset-left,0px);--sar:env(safe-area-inset-right,0px)}
html,body{height:100%;overflow:hidden;-webkit-text-size-adjust:100%;text-size-adjust:100%;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea{-webkit-user-select:text;user-select:text}
#shell{padding:calc(10px + var(--sat)) calc(10px + var(--sar)) 0 calc(10px + var(--sal));height:100%}
#tabbar{bottom:calc(10px + var(--sab))}
#view{padding-bottom:calc(104px + var(--sab));-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
#rail{top:calc(10px + var(--sat));bottom:calc(10px + var(--sab))}
body.hxmode #top{display:none}
body.hxmode #view{padding-top:0}
button{transition:transform .18s var(--ease),background-color .25s,border-color .25s,box-shadow .25s,color .25s}

.hx{min-height:100%;display:flex;flex-direction:column}
.hxn{display:flex;align-items:center;gap:10px;padding:4px 2px 10px;position:sticky;top:0;z-index:6}
.hxb{height:46px;padding:0 16px 0 8px;border-radius:23px;display:flex;align-items:center;gap:2px;font-weight:700;font-size:16px;background:rgba(255,255,255,.09);border:1px solid var(--line);backdrop-filter:blur(20px) saturate(160%);-webkit-backdrop-filter:blur(20px) saturate(160%);max-width:52vw}
.hxb span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hxb svg,.hxm svg{width:24px;height:24px;fill:none;stroke:var(--or);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;flex:none}
.hxm svg{stroke:#e8e8ea;stroke-width:2}
.hxb:active,.hxm:active{transform:scale(.94)}
.hxc{color:var(--mut);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}.hxc b{color:#fff;font-weight:600}
.hxm{width:46px;height:46px;border-radius:23px;flex:none;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.09);border:1px solid var(--line);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.hxlive{font-size:11px;font-weight:800;letter-spacing:.04em;padding:6px 10px;border-radius:99px;background:rgba(255,255,255,.07);border:1px solid var(--line);color:var(--mut);white-space:nowrap;max-width:34vw;overflow:hidden;text-overflow:ellipsis}
.hxlive.run{color:#111;background:var(--gr);border-color:var(--gr);animation:pulse 2s infinite}
.hxlive.pause{color:#111;background:var(--or);border-color:var(--or)}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(126,226,168,.5)}50%{box-shadow:0 0 0 6px rgba(126,226,168,0)}}
.hxh{padding:2px 4px 12px;border-radius:20px}
.hxh h1{font-size:30px;font-weight:800;letter-spacing:-.6px;line-height:1.1;display:flex;align-items:baseline;gap:10px}
.hxh h1 .no{color:var(--or)}
.hxh p{color:var(--mut);font-size:14px;margin-top:4px}
.hxact{margin-top:10px;height:46px;padding:0 18px;border-radius:16px;font-weight:700;background:linear-gradient(140deg,#ff8a3a,#d4550c);color:#fff}
.hxbody{flex:1;display:flex;gap:14px;min-height:0}
.hxmain{flex:1;display:flex;flex-direction:column;min-width:0}

/* Kacheln */
.hg{flex:1;display:grid;gap:10px;grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-rows:minmax(92px,1fr)}
.hg2{grid-auto-rows:minmax(118px,1fr)}
.ht{position:relative;display:flex;flex-direction:column;align-items:flex-start;text-align:left;padding:12px 13px;border-radius:22px;overflow:hidden;color:inherit;
 background:linear-gradient(160deg,rgba(255,255,255,.11),rgba(255,255,255,.03));border:1px solid var(--line);
 box-shadow:0 10px 30px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.14);backdrop-filter:blur(22px) saturate(150%);-webkit-backdrop-filter:blur(22px) saturate(150%)}
.ht::after{content:"";position:absolute;inset:0;background:radial-gradient(120px 80px at var(--mx,80%) -10%,rgba(255,255,255,.14),transparent 70%);pointer-events:none}
.ht:active{transform:scale(.965)}
.ht .n{font-size:30px;font-weight:800;color:var(--or);line-height:1;letter-spacing:-.5px}
.ht .nm{font-weight:700;font-size:15px;margin-top:6px;line-height:1.2}
.ht .ds{color:var(--mut);font-size:12px;margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ht .pc{position:absolute;right:12px;top:11px;font-size:11px;color:var(--mut);font-weight:700}
.ht.ok{border-color:rgba(126,226,168,.55);background:linear-gradient(160deg,rgba(126,226,168,.18),rgba(126,226,168,.04))}
.ht.ok .pc{color:var(--gr)}
.hbar{margin-top:auto;width:100%;height:5px;border-radius:3px;background:rgba(255,255,255,.1);overflow:hidden}
.hbar i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,#4cc98a,var(--gr));transform-origin:left;animation:grow .9s var(--ease) both}
@keyframes grow{from{transform:scaleX(0)}}
.ht .kp{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}.ht .kp span{font-size:11px;padding:3px 7px;border-radius:8px;background:rgba(255,255,255,.08);color:#d6d9dd}.ht .kp b{color:#fff}
.ht .dots{display:flex;flex-wrap:wrap;gap:4px;margin:8px 0 8px}
.ht .dots i{font-style:normal;min-width:24px;height:24px;padding:0 4px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;background:rgba(255,255,255,.07);border:1px solid var(--line);color:var(--mut)}
.ht .dots i.s1{border-color:rgba(255,122,36,.6);color:#ffb27a}
.ht .dots i.s2{background:rgba(126,226,168,.2);border-color:rgba(126,226,168,.6);color:var(--gr)}
.hg2 .ht.wide{grid-column:span 2}

/* Leiste der Kapitel (Tablet) */
.hxr{display:none}
.hxpn{display:flex;gap:10px;margin-top:12px}
.hxpn>*{flex:1}
.hxpn button{min-height:52px;border-radius:18px;padding:0 14px;font-weight:700;font-size:15px;background:rgba(255,255,255,.08);border:1px solid var(--line);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.hxpn button.pri{background:linear-gradient(140deg,#ff8a3a,#d4550c);border-color:rgba(255,255,255,.25);color:#fff}
.hxpn button:active{transform:scale(.96)}
.hxpn.sm{align-items:center}.hxpn.sm button{flex:0 0 auto;min-width:120px}
.hxpn .sw{flex:1;text-align:center;color:var(--mut);font-size:12px}

/* Nummern-Leiste 1,2,3 … */
.rns{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 12px;scrollbar-width:none;scroll-snap-type:x proximity;-webkit-mask-image:linear-gradient(90deg,transparent,#000 14px,#000 calc(100% - 14px),transparent);mask-image:linear-gradient(90deg,transparent,#000 14px,#000 calc(100% - 14px),transparent)}
.rns::-webkit-scrollbar{display:none}
.rn{flex:none;min-width:54px;height:54px;padding:0 8px;border-radius:18px;font-weight:800;font-size:18px;scroll-snap-align:center;position:relative;
 background:rgba(255,255,255,.07);border:1px solid var(--line);color:#e8e8ea;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.rn.s1::after{content:"";position:absolute;right:7px;top:7px;width:7px;height:7px;border-radius:50%;background:var(--or)}
.rn.s2{color:var(--gr);border-color:rgba(126,226,168,.6);background:rgba(126,226,168,.12)}
.rn.mk{box-shadow:inset 0 -3px 0 rgba(255,122,36,.7)}
.rn.on{background:linear-gradient(140deg,#ff8a3a,#d4550c);border-color:transparent;color:#fff;transform:scale(1.08);box-shadow:0 8px 24px rgba(224,102,15,.45)}
.rn.on.s2{background:linear-gradient(140deg,#5fe0a0,#2fb565);color:#062b16}

/* Ein Unterpunkt */
.stage{position:relative;touch-action:pan-y}
.hxi{border-radius:26px;padding:16px;background:linear-gradient(165deg,rgba(255,255,255,.12),rgba(255,255,255,.035));border:1px solid var(--line);
 box-shadow:0 18px 40px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.16);backdrop-filter:blur(26px) saturate(160%);-webkit-backdrop-filter:blur(26px) saturate(160%);will-change:transform}
.hxi.hl{border-color:rgba(255,122,36,.55)}
.hxt{display:flex;align-items:center;gap:14px;margin-bottom:12px}
.hxt .big{font-size:52px;font-weight:800;line-height:1;letter-spacing:-1.5px;color:var(--or);min-width:56px;text-align:center}
.hxt b{display:block;font-size:19px;line-height:1.2}.hxt small{color:var(--mut);font-size:13px}
.hfs{display:grid;grid-template-columns:1fr;gap:9px}
.hf{border-radius:18px;background:rgba(0,0,0,.22);border:1px solid rgba(255,255,255,.09);padding:9px 12px 10px;min-width:0}
.hf label{display:block;font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.08em;font-weight:700;margin-bottom:3px}
.hf button.ed{min-height:46px;font-size:18px;font-weight:600;padding:8px 2px;border:0;background:none;display:flex;align-items:center;justify-content:space-between;gap:8px}
.hf button.ed::after{content:"ändern ›";font-size:13px;font-weight:700;color:var(--or);flex:none}
.hf button.ed.empty{background:rgba(255,255,255,.05);border:1px dashed rgba(255,255,255,.2);padding:8px 12px}
.hf button.ed.empty::after{content:"＋"}
.hf .cyc{min-width:72px;height:48px;font-size:18px;border-radius:14px}
.hf .chk{width:48px;height:48px}
.hf input{width:100%;margin:4px 0}
.hf .cc{gap:10px}
.lockbig{margin-top:12px;width:100%;height:58px;border-radius:20px;display:flex;align-items:center;justify-content:center;gap:10px;font-weight:800;font-size:17px;
 background:rgba(255,255,255,.06);border:1.5px dashed rgba(126,226,168,.55);color:var(--gr)}
.lockbig .ck{width:30px;height:30px;border-radius:50%;border:2px solid var(--gr);display:flex;align-items:center;justify-content:center;font-size:16px;color:transparent;transition:all .3s var(--ease)}
.lockbig.on{background:linear-gradient(140deg,rgba(95,224,160,.95),rgba(47,181,101,.95));border:1.5px solid transparent;color:#062b16;box-shadow:0 10px 28px rgba(47,181,101,.4)}
.lockbig.on .ck{background:#062b16;border-color:#062b16;color:var(--gr)}
.hxi.locked .hf{opacity:.62}
.hxi.locked .hf button,.hxi.locked .hf input{pointer-events:none}
.hxi.locked .hf button.ed::after{content:""}
.hxnote{margin-top:12px;font-size:14px;color:var(--mut)}
.hxnote .note,.hxnote p{color:var(--mut)}
.hxinfo{flex:1}
.hxinfo>*{animation:none}

/* Bewegung: Kacheln fliegen gestaffelt ein, Ebenen gleiten */
@keyframes tin{from{opacity:0;transform:translateY(18px) scale(.94)}}
@keyframes fin{from{opacity:0;transform:translateX(48px)}}
@keyframes bin{from{opacity:0;transform:translateX(-48px)}}

  <div class="card"><h3>Drucken & speichern</h3><p>Box-Etiketten (A5 auf A4) und beliebige Kapitel aus Heft und Ordner mit deinen Einträgen – drucken oder als PDF-Datei speichern.</p><button class="btn pri" id="prOpen">Auswählen …</button></div>
  <div class="card"><h3>Sichern</h3><p>Alle Einträge liegen nur auf diesem Tablet. Sichere sie ab und zu als Datei (z. B. in die Dropbox).</p>
    <div class="row" style="margin-top:10px"><button class="btn pri" id="dExp">Sicherung speichern</button><label class="btn">Sicherung laden<input type="file" id="dImp" accept=".json,application/json" hidden></label></div>
    <h3 style="margin-top:18px">Tablet</h3>
    ${[["keepOn", "Bildschirm bleibt an"], ["lock", "Live-Fenster im Sperrbildschirm"], ["bell", "Glocke (Ton)"], ["vib", "Vibration"]].map(([k, l]) => `<div class="set"><div>${l}</div><button class="tog ${OPT[k] ? "on" : ""}" data-tog="${k}"></button></div>`).join("")}
    <p class="note" style="margin-top:8px">${NB ? "App-Version mit Sperrbildschirm-Fenster und Glocke im Hintergrund." : "Browser-Version: Glocke und Live nur bei geöffneter Seite."}</p></div></div>`;
  view.querySelectorAll("[data-r]").forEach(b => b.onclick = () => { setRace(b.dataset.r); vDaten(); });
  view.querySelectorAll("[data-km]").forEach(b => b.onclick = () => editKm(b.dataset.km, vDaten));
  $("voTog") && ($("voTog").onclick = () => { OPT.voice = OPT.voice === false; saveOpt(); voiceNative(); if (OPT.voice) speak("Sprachansage ist an. Nach jedem Kilometer hörst du deine Pace."); vDaten(); });
  $("voTest") && ($("voTest").onclick = () => { const d = { kmN: 3, kmPace: 432, pMin: 435, pMax: 455, kmPause: 642, iv: 3600 }; if (NB && NB.ios && NB.say) NB.say(kmText(d)); else speak(kmText(d)); });
  $("prOpen") && ($("prOpen").onclick = () => printSheet(null));
  $("syGo").onclick = () => sySet($("syIn").value);
  $("syNew") && ($("syNew").onclick = () => sySet(syNewCode()));
  $("syOff") && ($("syOff").onclick = () => { if (confirm("Sync auf diesem Gerät ausschalten?")) sySet(""); });
  $("syNow") && ($("syNow").onclick = () => { syConnect().then(() => sySnap(true)); toast("Abgleich läuft"); });
  syStatus();
  view.querySelectorAll("[data-del]").forEach(b => b.onclick = () => { if (RACES.length < 2 || !confirm("Rennen aus der Liste nehmen? Die Einträge bleiben gespeichert.")) return; RACES = RACES.filter(r => r.id !== b.dataset.del); saveRaces(); if (RACE === b.dataset.del) setRace(RACES[0].id); vDaten(); fillRaces(); });
  $("nAdd").onclick = () => { const n = $("nN").value.trim(), d = $("nD").value; if (!n || !d) return toast("Name und Datum eintragen"); const id = n.toLowerCase().replace(/[^a-z0-9]+/g, "-") + "-" + d.slice(0, 4); RACES.push({ id, name: n, date: d, start: $("nS").value || "09:00" }); saveRaces(); setRace(id); fillRaces(); vDaten(); };
  view.querySelectorAll("[data-tog]").forEach(b => b.onclick = () => { OPT[b.dataset.tog] = !OPT[b.dataset.tog]; saveOpt(); NB && NB.keepOn && NB.keepOn(!!OPT.keepOn); vDaten(); });
  $("dExp").onclick = () => {
    const all = {}; for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k.startsWith("yb:")) all[k] = localStorage.getItem(k); }
    const name = "Yardbell-Sicherung " + new Date().toISOString().slice(0, 10) + ".json", txt = JSON.stringify(all);
    if (NB && NB.saveFile) { toast(NB.saveFile(name, txt)); return; }
    const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([txt], { type: "application/json" })); a.download = name; a.click();
  };
  $("dImp").onchange = e => { const f = e.target.files[0]; if (!f) return; f.text().then(t => { const o = JSON.parse(t); Object.entries(o).forEach(([k, v]) => k.startsWith("yb:") && localStorage.setItem(k, v)); toast("Sicherung geladen"); setTimeout(() => location.reload(), 600); }); };
}
function fillRaces() { $("raceSel").innerHTML = RACES.map(r => `<option value="${r.id}" ${r.id === RACE ? "selected" : ""}>${esc(r.name)}</option>`).join(""); }
function setRace(id) { RACE = id; LS.set("race", id); fillRaces(); applyLapKm(); }
$("raceSel").onchange = e => { setRace(e.target.value); render(); };

// ---------- Takt ----------
let bgKey = "";
function bgTrack() {
  const k = L.pts.length;
  if (k === bgKey) return; bgKey = k;
  const el = $("bgtrack"); if (!el) return;
  el.innerHTML = k > 1 ? trackSVG(L.pts).replace('viewBox="0 0 300 170"', 'viewBox="0 0 300 170" preserveAspectRatio="xMidYMid slice"').replace('stroke-width="3"', 'stroke-width="2"')
    : `<svg viewBox="0 0 100 100" preserveAspectRatio="xMidYMid slice"><path d="M20 55c0-22 26-30 46-26s22 22 8 32-30 14-42 8-12-8-12-14z" fill="none" stroke="#ff7a24" stroke-width="1.6"/></svg>`;
}
function topbar() {
  bgTrack(); $("brandRace").textContent = raceObj().name;
  const lsx = liveState(); $("navLive").textContent = lsx.st === "run" || lsx.st === "pause" || lsx.st === "wait" || (lsx.st === "ready" && !lsx.gone) ? "LIVE" : "";
  const d = new Date(); $("clockNow").textContent = two(d.getHours()) + ":" + two(d.getMinutes()) + ":" + two(d.getSeconds());
  const l = liveState(), p = $("livePill");
  if (l.st === "off") { p.textContent = "LIVE AUS"; p.className = "pill"; }
  else if (l.st === "none") { p.textContent = "LIVE " + L.code + " · WARTET"; p.className = "pill"; }
  else if (l.st === "ready") { p.textContent = l.label; p.className = "pill " + (l.gone ? "stale" : l.gpsOk ? "fin" : "pause"); }
  else { p.textContent = (l.stale ? "KEINE DATEN · " : "") + l.label; p.className = "pill " + (l.stale ? "stale" : l.st === "run" ? "run" : l.st === "pause" ? "pause" : l.st === "fin" ? "fin" : ""); }
  $("netState").textContent = navigator.onLine ? "online" : "offline – Einträge werden gespeichert";
}
setInterval(() => {
  eTick();
  if (OPT.share && E.startT && (shareSoon || now() - lastShare > 120)) share(false);
  autoProto(); topbar(); tickers.forEach(f => f());
}, 1000);
window.addEventListener("online", () => { L.code && liveConnect(); syConnect(); topbar(); });
document.addEventListener("visibilitychange", () => { if (!document.hidden && SY.code) syConnect(); });
window.addEventListener("offline", topbar);
applyLapKm(); fillRaces(); render(); topbar(); voiceNative();
if (SY.code) syConnect();
if (L.code) liveConnect();
if (E.startT) nativeClock();
else setTimeout(() => { const l = liveState(); if (!(l.st === "run" || l.st === "pause" || l.st === "wait") || l.lag > 900) liveBellsOff(); }, 4000);
NB && NB.keepOn && NB.keepOn(!!OPT.keepOn);
NB && NB.setOpt && NB.setOpt(JSON.stringify(OPT));
if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
})();

</script>
</body>
</html>
